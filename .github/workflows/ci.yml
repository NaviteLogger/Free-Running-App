name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch. A new push cancels the previous run instead of queueing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Node 24, TypeScript 7)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      # ci, not install: fails if package-lock.json disagrees with package.json
      # instead of quietly resolving something else.
      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Strict config still rejects what it should
        run: npm run typecheck:config

      - name: Tests
        run: npm test

  app:
    name: App (Flutter, Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Any analyzer message fails the build, including hints. Warnings that
      # nobody has to fix are warnings nobody reads.
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Tests
        run: flutter test

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: app
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
